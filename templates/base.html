<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %} Student Management System {% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/"> 🎓 SMS </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/"> Dashboard </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/students"> Students </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/add_student"> Add Student </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Content -->

    <div class="container mt-4">{% block content %} {% endblock %}</div>

    <!-- Footer -->

    <footer class="bg-light border-top text-center py-3 mt-5">
      <small> Student Management System © 2026 </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
