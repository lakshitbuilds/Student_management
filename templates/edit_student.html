{% extends "base.html" %} {% block title %} Edit Student {% endblock %} {% block
content %}

<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-warning">
      <h3>Edit Student</h3>
    </div>

    <div class="card-body">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label"> Student ID </label>

          <input
            type="number"
            class="form-control"
            name="id"
            value="{{ student[0]}}"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label"> Name </label>

          <input
            type="text"
            class="form-control"
            name="name"
            value="{{ student[1] }}"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label"> Age </label>

          <input
            type="number"
            class="form-control"
            name="age"
            value="{{ student[2]}}"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label"> Course </label>

          <input
            type="text"
            class="form-control"
            name="course"
            value="{{ student[3] }}"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label"> Email </label>

          <input
            type="email"
            class="form-control"
            name="email"
            value="{{ student[4] }}"
          />
        </div>

        <button type="submit" class="btn btn-success">Update Student</button>

        <a href="/students" class="btn btn-secondary"> Cancel </a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
